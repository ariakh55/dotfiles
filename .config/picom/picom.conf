backend = "glx";
vsync = true;
glx-use-copysubbuffer-mesa = true;

glx-copy-from-front = true;
glx-swap-method = 2;
xrender-sync = true;
xrender-sync-fence = true;

# Radius for rounded corners, default 0 (disabled)
corner-radius = 5;

animations = (
        {
                triggers = ["close", "hide"];
                preset = "disappear";
                duration = 0.16;
                scale = 1.0;
        },
        {
                triggers = ["open", "show"];
                preset = "appear";
                duration = 0.16;
                scale = 0.98;
        },
        {
                triggers = ["geometry"];
                preset = "geometry-change";
                duration = 0.16;
        }
);

